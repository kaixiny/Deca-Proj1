<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px; height: 1660px;
    background: #0D0D0D;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 80px 72px;
    overflow: hidden;
  }
  .top-tag {
    display: flex; align-items: center; gap: 16px;
  }
  .tag {
    background: #FF6B35;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .tag-sub {
    color: #888;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 2px;
  }
  .center-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 48px;
  }
  .eyebrow {
    color: #FF6B35;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .main-title {
    color: #FFFFFF;
    font-size: 96px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -2px;
  }
  .main-title .accent { color: #FF6B35; }
  .sub-title {
    color: #CCCCCC;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.6;
    max-width: 900px;
  }
  .games-row {
    display: flex; gap: 32px; align-items: center;
    margin-top: 16px;
  }
  .game-chip {
    background: #1A1A1A;
    border: 2px solid #FF6B35;
    color: #FF6B35;
    font-size: 32px;
    font-weight: 800;
    padding: 16px 40px;
    border-radius: 8px;
    letter-spacing: 2px;
  }
  .plus { color: #555; font-size: 40px; font-weight: 300; }
  .game-name {
    color: #888;
    font-size: 26px;
    font-weight: 400;
  }
  .divider {
    width: 80px; height: 4px;
    background: #FF6B35;
    border-radius: 2px;
  }
  .stats-row {
    display: flex; gap: 60px;
    margin-top: 20px;
  }
  .stat-item { display: flex; flex-direction: column; gap: 8px; }
  .stat-num {
    color: #FF6B35;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -1px;
  }
  .stat-label {
    color: #888;
    font-size: 24px;
    font-weight: 400;
  }
  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .source-tag {
    color: #444;
    font-size: 22px;
  }
  .watermark {
    color: #444;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .bg-deco {
    position: absolute;
    top: 0; right: 0;
    width: 600px; height: 600px;
    background: radial-gradient(circle at 80% 20%, rgba(255,107,53,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .line-deco {
    position: absolute;
    bottom: 200px; right: 72px;
    width: 2px; height: 300px;
    background: linear-gradient(to bottom, #FF6B35, transparent);
  }
</style>
</head>
<body>
  <div class="bg-deco"></div>
  <div class="line-deco"></div>

  <div class="top-tag">
    <span class="tag">DECA GAMES</span>
    <span class="tag-sub">长青化运营深度研究</span>
  </div>

  <div class="center-block">
    <div class="eyebrow">EVD &amp; KBN · 策略演变报告</div>
    <div class="main-title">
      手游如何<br>活过<span class="accent">十年</span>？
    </div>
    <div class="sub-title">
      从《霍比特人》IP 授权危机到 Battle Pass 现代化<br>
      飓风工作室 × Deca 的长青化运营全解析
    </div>
    <div class="divider"></div>
    <div class="games-row">
      <div class="game-chip">EVD</div>
      <div class="plus">+</div>
      <div class="game-chip">KBN</div>
      <div class="game-name">精灵大战矮人 · 卡美洛王国：北境之战</div>
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num">14年</div>
        <div class="stat-label">KBN 运营年限（2012—今）</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">€156M</div>
        <div class="stat-label">Deca 2022 年营收</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">800K</div>
        <div class="stat-label">月活跃玩家（2021）</div>
      </div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="source-tag">数据来源：App Store / Embracer 官方新闻稿</div>
    <div class="watermark">DECA × 聚锋</div>
  </div>
</body>
</html>
