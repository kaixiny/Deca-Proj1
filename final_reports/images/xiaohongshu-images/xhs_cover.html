<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1242px; height:1660px; background:#0a0a0a; font-family:'Microsoft YaHei','PingFang SC',Inter,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
.bg-grid { position:absolute; inset:0; background-image: linear-gradient(rgba(255,107,53,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,53,.07) 1px,transparent 1px); background-size:50px 50px; }
.glow-top { position:absolute; width:900px; height:900px; background:radial-gradient(circle,rgba(255,107,53,.15) 0%,transparent 65%); top:-200px; left:50%; transform:translateX(-50%); }
.glow-bot { position:absolute; width:600px; height:600px; background:radial-gradient(circle,rgba(255,107,53,.08) 0%,transparent 65%); bottom:-100px; right:-100px; }
.content { position:relative; z-index:10; text-align:center; padding:0 80px; }
.badge { display:inline-block; background:rgba(255,107,53,.2); border:1px solid rgba(255,107,53,.5); color:#FF6B35; font-size:26px; padding:10px 36px; border-radius:4px; letter-spacing:5px; margin-bottom:60px; }
h1 { font-size:90px; font-weight:900; color:#fff; line-height:1.15; margin-bottom:40px; letter-spacing:2px; }
h1 .accent { color:#FF6B35; }
.subtitle { font-size:34px; color:rgba(255,255,255,.55); margin-bottom:80px; line-height:1.6; }
.tags { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin-bottom:80px; }
.tag { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); color:rgba(255,255,255,.65); padding:12px 30px; border-radius:40px; font-size:24px; }
.divider { width:100px; height:3px; background:linear-gradient(90deg,transparent,#FF6B35,transparent); margin:0 auto 60px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.stat { background:rgba(255,255,255,.04); border:1px solid rgba(255,107,53,.2); border-radius:12px; padding:30px 20px; }
.stat-num { font-size:52px; font-weight:900; color:#FF6B35; line-height:1; }
.stat-label { font-size:20px; color:rgba(255,255,255,.5); margin-top:8px; }
.watermark { position:absolute; bottom:36px; right:48px; font-size:20px; color:rgba(255,255,255,.2); }
</style></head><body>
<div class="bg-grid"></div>
<div class="glow-top"></div>
<div class="glow-bot"></div>
<div class="content">
  <div class="badge">DECA × 聚锋 深度研究</div>
  <h1>手游怎么<br><span class="accent">活过14年</span>？</h1>
  <div class="subtitle">Deca中国工作室旗下<br>EVD & KBN 长青化运营策略全解析</div>
  <div class="tags">
    <div class="tag">精灵大战矮人 · EVD</div>
    <div class="tag">卡米洛特王国 · KBN</div>
    <div class="tag">聚风工作室</div>
  </div>
  <div class="divider"></div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num">14</div>
      <div class="stat-label">KBN运营年数</div>
    </div>
    <div class="stat">
      <div class="stat-num">950万</div>
      <div class="stat-label">KBN峰值玩家</div>
    </div>
    <div class="stat">
      <div class="stat-num">4</div>
      <div class="stat-label">长青化核心支柱</div>
    </div>
  </div>
</div>
<div class="watermark">DECA × 聚锋</div>
</body></html>
