<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1242px; height:1242px; background:#0f0f0f; font-family:'Microsoft YaHei','PingFang SC',Inter,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px; }
.section-tag { font-size:20px; color:#FF6B35; letter-spacing:4px; margin-bottom:18px; text-align:center; }
h2 { font-size:52px; font-weight:800; color:#fff; text-align:center; margin-bottom:48px; }
h2 span { color:#FF6B35; }
.compare { display:grid; grid-template-columns:1fr 80px 1fr; gap:0; width:100%; margin-bottom:40px; }
.col { background:rgba(255,255,255,.04); border:1px solid rgba(255,107,53,.2); border-radius:14px; padding:32px 28px; }
.col-title { font-size:28px; font-weight:700; color:#FF6B35; margin-bottom:6px; }
.col-sub { font-size:16px; color:rgba(255,255,255,.35); margin-bottom:24px; }
.col-strategy { font-size:20px; font-weight:700; color:#fff; margin-bottom:20px; padding:12px 16px; background:rgba(255,107,53,.1); border-radius:8px; border-left:3px solid #FF6B35; }
.col-item { font-size:18px; color:rgba(255,255,255,.65); line-height:1.6; display:flex; gap:8px; margin-bottom:10px; }
.col-item::before { content:'▸'; color:#FF6B35; flex-shrink:0; }
.vs-center { display:flex; align-items:center; justify-content:center; }
.vs-badge { width:60px; height:60px; border-radius:50%; border:2px solid #FF6B35; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:#FF6B35; }
.common-box { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:24px 28px; width:100%; }
.common-title { font-size:20px; color:rgba(255,255,255,.5); margin-bottom:16px; text-align:center; letter-spacing:2px; }
.common-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.common-item { text-align:center; }
.common-label { font-size:14px; color:rgba(255,255,255,.3); margin-bottom:6px; }
.common-value { font-size:16px; color:rgba(255,255,255,.7); font-weight:600; }
.watermark { position:absolute; bottom:24px; right:40px; font-size:15px; color:rgba(255,255,255,.15); }
</style></head><body>
<div class="section-tag">策略对比</div>
<h2>两条不同的<span>长青化路线</span></h2>
<div class="compare">
  <div class="col">
    <div class="col-title">EVD</div>
    <div class="col-sub">精灵大战矮人</div>
    <div class="col-strategy">🔽 垂直深挖</div>
    <div class="col-item">新城市 + 神坛建筑</div>
    <div class="col-item">誓约军队新兵种</div>
    <div class="col-item">科技树全新分支</div>
    <div class="col-item">英雄5星→10星</div>
    <div class="col-item">终极：Battle Pass订阅制</div>
  </div>
  <div class="vs-center">
    <div class="vs-badge">VS</div>
  </div>
  <div class="col">
    <div class="col-title">KBN</div>
    <div class="col-sub">卡米洛特王国</div>
    <div class="col-strategy">↔️ 横向叠加</div>
    <div class="col-item">特殊卡牌收藏系统</div>
    <div class="col-item">City Halo城市光环</div>
    <div class="col-item">英雄皮肤+装备进化</div>
    <div class="col-item">宝箱/消费返利活动</div>
    <div class="col-item">利用14年IP品牌忠诚度</div>
  </div>
</div>
<div class="common-box">
  <div class="common-title">两款游戏共同演变规律</div>
  <div class="common-grid">
    <div class="common-item"><div class="common-label">内容节奏</div><div class="common-value">季度→双月→月度</div></div>
    <div class="common-item"><div class="common-label">外观经济</div><div class="common-value">偶发→系统化皮肤池</div></div>
    <div class="common-item"><div class="common-label">活动变现</div><div class="common-value">道具销售→订阅制</div></div>
  </div>
</div>
<div class="watermark">DECA × 聚锋</div>
</body></html>
