<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1242px; height:1242px; background:#0f0f0f; font-family:'Microsoft YaHei','PingFang SC',Inter,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px 60px; }
.section-tag { font-size:20px; color:#FF6B35; letter-spacing:4px; margin-bottom:18px; text-align:center; }
h2 { font-size:52px; font-weight:800; color:#fff; text-align:center; margin-bottom:48px; }
h2 span { color:#FF6B35; }
.crisis-box { background:rgba(255,50,50,.08); border:1px solid rgba(255,80,80,.3); border-radius:14px; padding:32px 36px; margin-bottom:36px; width:100%; }
.crisis-title { font-size:22px; color:rgba(255,100,100,.9); font-weight:700; margin-bottom:20px; }
.crisis-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
.crisis-stat { text-align:center; }
.crisis-num { font-size:48px; font-weight:900; color:#ff6060; line-height:1; }
.crisis-label { font-size:16px; color:rgba(255,255,255,.4); margin-top:6px; }
.resilience-box { background:rgba(255,107,53,.08); border:1px solid rgba(255,107,53,.3); border-radius:14px; padding:32px 36px; width:100%; }
.resilience-title { font-size:22px; color:#FF6B35; font-weight:700; margin-bottom:20px; }
.resilience-item { display:flex; align-items:flex-start; gap:14px; margin-bottom:18px; }
.r-icon { font-size:28px; flex-shrink:0; }
.r-text { font-size:20px; color:rgba(255,255,255,.75); line-height:1.5; }
.r-text em { color:#FF6B35; font-style:normal; font-weight:700; }
.conclusion { margin-top:32px; background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(255,107,53,.05)); border:1px solid rgba(255,107,53,.3); border-radius:10px; padding:20px 28px; text-align:center; font-size:22px; color:#fff; line-height:1.6; }
.conclusion em { color:#FF6B35; font-style:normal; font-weight:700; }
.watermark { position:absolute; bottom:24px; right:40px; font-size:15px; color:rgba(255,255,255,.15); }
</style></head><body>
<div class="section-tag">运营韧性</div>
<h2>大裁员下<span>照常更新</span>的秘密</h2>
<div class="crisis-box">
  <div class="crisis-title">⚠️ Embracer 2023年大规模重组</div>
  <div class="crisis-stats">
    <div class="crisis-stat"><div class="crisis-num">7,800</div><div class="crisis-label">裁员人数</div></div>
    <div class="crisis-stat"><div class="crisis-num">44</div><div class="crisis-label">关闭工作室</div></div>
    <div class="crisis-stat"><div class="crisis-num">80</div><div class="crisis-label">取消项目</div></div>
  </div>
</div>
<div class="resilience-box">
  <div class="resilience-title">✅ EVD & KBN 的表现</div>
  <div class="resilience-item"><span class="r-icon">📅</span><div class="r-text">整个重组期间（2023–2024），两款游戏<em>版本更新从未中断</em></div></div>
  <div class="resilience-item"><span class="r-icon">🚀</span><div class="r-text">EVD在2024年完成<em>最大规模系统扩张</em>（第六城+英雄10星）</div></div>
  <div class="resilience-item"><span class="r-icon">💡</span><div class="r-text">KBN同期引入<em>英雄皮肤+装备进化</em>等新付费体系</div></div>
</div>
<div class="conclusion">
  手游Live Ops = <em>低资本 + 稳现金流</em><br>即使集团崩了，长尾游戏照样能活
</div>
<div class="watermark">DECA × 聚锋</div>
</body></html>
