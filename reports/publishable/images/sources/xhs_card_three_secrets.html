<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1242px; height: 1242px; overflow: hidden; background: #FFFFFF; }
body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; display: flex; flex-direction: column; padding: 80px 80px 56px 80px; }

.header { margin-bottom: 52px; }
.eyebrow { font-family: 'Inter',system-ui,sans-serif; font-size: 18px; font-weight: 700; color: #FF6B35; letter-spacing: 3px; margin-bottom: 12px; }
.title { font-size: 50px; font-weight: 700; color: #000; line-height: 1.2; }
.accent { width: 64px; height: 5px; background: #FF6B35; border-radius: 3px; margin-top: 18px; }

/* 3 secret cards */
.secrets { flex: 1; display: flex; flex-direction: column; gap: 28px; }

.secret {
  flex: 1; border: 1.5px solid #E0E0E0; border-radius: 20px;
  padding: 32px 36px; display: flex; gap: 28px; align-items: flex-start;
}

.num {
  font-family: 'Inter',system-ui,sans-serif;
  font-size: 48px; font-weight: 900; color: #FF6B35;
  line-height: 1; flex-shrink: 0; width: 52px; text-align: center;
}

.body {}
.secret-title { font-size: 28px; font-weight: 700; color: #000; margin-bottom: 10px; line-height: 1.2; }
.secret-desc { font-size: 21px; color: #555; line-height: 1.6; }
.secret-desc strong { color: #000; font-weight: 700; }
.secret-tag {
  display: inline-block; margin-top: 12px;
  padding: 4px 14px; background: #FFF3EE;
  border-radius: 10px; font-size: 17px; color: #FF6B35; font-weight: 600;
}

.footer { padding-top: 22px; border-top: 1px solid #E0E0E0; display: flex; justify-content: space-between; font-size: 16px; color: #999; font-family: 'Inter',system-ui,sans-serif; }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Deca 长青化方法论</div>
  <div class="title">让老游戏不死的<br>三个核心秘诀</div>
  <div class="accent"></div>
</div>

<div class="secrets">

  <div class="secret">
    <div class="num">①</div>
    <div class="body">
      <div class="secret-title">养成天花板持续上移</div>
      <div class="secret-desc">
        英雄升星、坐骑升星、城市建筑层层加码。<br>
        只要天花板还在，<strong>重度玩家就永远有下一个目标</strong>，付费周期就不会断。
      </div>
      <span class="secret-tag">天花板↑ · 延长付费周期</span>
    </div>
  </div>

  <div class="secret">
    <div class="num">②</div>
    <div class="body">
      <div class="secret-title">皮肤 + 数值，双轨并行</div>
      <div class="secret-desc">
        外观付费给轻氪玩家，数值养成给重氪玩家。<br>
        <strong>两类用户，一个都不放过。</strong>
      </div>
      <span class="secret-tag">轻氪+重氪 · 覆盖全层用户</span>
    </div>
  </div>

  <div class="secret">
    <div class="num">③</div>
    <div class="body">
      <div class="secret-title">变现机制跟着合规走</div>
      <div class="secret-desc">
        转盘加保底、引入 Battle Pass，<br>
        主动适配全球手游监管趋势，<strong>降低被下架风险</strong>。
      </div>
      <span class="secret-tag">合规先行 · 稳定上架资格</span>
    </div>
  </div>

</div>

<div class="footer">
  <span>基于 EVD + KBN 2024–2026 版本历史</span>
  <span>DECA × 聚锋</span>
</div>

</body>
</html>
